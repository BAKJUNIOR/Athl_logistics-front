<section class="phero">
  <div class="phero__eyebrow" appReveal>Projets</div>
  <h1 [appReveal]="80">Ce que nos équipes construisent</h1>
  <p [appReveal]="160">Constructions neuves, rénovations et aménagements : un aperçu de nos chantiers livrés et en cours.</p>
</section>

<section class="gallery">
  <div class="gallery__grid">
    @for (shot of shots; track shot.image; let i = $index) {
      <figure class="shot" [class.shot--wide]="shot.wide" [appReveal]="80 * i">
        <img [src]="shot.image" [alt]="shot.alt" loading="lazy" />
        <figcaption><span>{{ shot.title }}</span><em>{{ shot.caption }}</em></figcaption>
      </figure>
    }
  </div>
</section>

<app-cta-banner appReveal title="Un projet en tête ?" text="Décrivez-nous votre chantier, nous revenons vers vous avec une estimation." mediaImage="images/proj-3.png" mediaAlt="Équipe étudiant les plans">
  <a class="btn btn--light" routerLink="/devis">Demander un devis</a>
  <a class="btn btn--ghost" routerLink="/services">Nos services</a>
</app-cta-banner>
